[theme]
# "light" or "dark", the starting point
base = "dark"
# your accent: buttons, sliders, links, the send arrow
primaryColor = "#FFC93C"
# the main page
backgroundColor = "#10131A"
# the sidebar and chat bubbles
secondaryBackgroundColor = "#1B2233"
# all your text
textColor = "#EAEFF7"
# outlines on boxes and inputs
borderColor = "#2A3446"
# "sans serif", "serif" or "monospace"
font = "Pixelify Sans"
# a different font just for titles
headingFont = "Pixelify Sans"

# "none", "small", "medium", "large", "full"
baseRadius = "full"
[[theme.fontFaces]]
family = "Pixelify Sans"
url = "https://fonts.gstatic.com/s/pixelifysans/v3/CHylV-3HFUT7aC4iv1TxGDR9Jn0Ei0tSaJ0.woff2"
weight = 400
style = "normal"